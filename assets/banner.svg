<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Fortinet Security Fabric - Dashboard Pitch Deck Ejecutivo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F8FB"/>
      <stop offset="55%" stop-color="#F1F4F8"/>
      <stop offset="100%" stop-color="#E9EEF4"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="85%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#EE2737" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#EE2737" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="12%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#0B7FA0" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0B7FA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEm" cx="60%" cy="110%" r="45%">
      <stop offset="0%" stop-color="#0E8F66" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#0E8F66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B7FA0"/>
      <stop offset="100%" stop-color="#EE2737"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EE2737"/>
      <stop offset="55%" stop-color="#5CC4DB"/>
      <stop offset="100%" stop-color="#62CBA8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0F172A" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo claro -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glowRed)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glowEm)"/>

  <!-- Escudo wireframe -->
  <g transform="translate(150,210)">
    <path d="M0,-118 L96,-84 L96,-14 C96,52 48,96 0,118 C-48,96 -96,52 -96,-14 L-96,-84 Z"
          fill="#FFFFFF" stroke="url(#shieldStroke)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0,-88 L72,-62 L72,-12 C72,36 36,70 0,88 C-36,70 -72,36 -72,-12 L-72,-62 Z"
          fill="none" stroke="#0B7FA0" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-34,2 L-10,28 L38,-26" fill="none" stroke="#0E8F66" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Red de nodos conectados -->
  <g stroke="#0B7FA0" stroke-opacity=".45" stroke-width="1.6" fill="none">
    <path d="M262,150 L330,110 M262,150 L340,196 M340,196 L420,168 M330,110 L420,168 M420,168 L486,132 M420,168 L492,222"/>
  </g>
  <g>
    <circle cx="262" cy="150" r="6" fill="#0B7FA0"/>
    <circle cx="330" cy="110" r="5" fill="#0E8F66"/>
    <circle cx="340" cy="196" r="5" fill="#EE2737"/>
    <circle cx="420" cy="168" r="7" fill="#0B7FA0"/>
    <circle cx="486" cy="132" r="5" fill="#0E8F66"/>
    <circle cx="492" cy="222" r="5" fill="#EE2737"/>
  </g>

  <!-- Título -->
  <g font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="560" y="118" width="74" height="6" rx="3" fill="#EE2737"/>
    <text x="560" y="186" font-size="54" font-weight="800" fill="#141A26" letter-spacing="-1">FORTINET</text>
    <text x="560" y="246" font-size="54" font-weight="800" fill="#0B7FA0" letter-spacing="-1">SECURITY FABRIC</text>
    <text x="560" y="292" font-size="22" font-weight="500" fill="#5A6478">Dashboard Pitch Deck Ejecutivo · 6 soluciones · 5 minutos</text>
  </g>

  <!-- Chips de pilar -->
  <g font-family="'SF Pro Text','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">
    <g>
      <rect x="560" y="322" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#EE2737" stroke-opacity=".55"/>
      <text x="658" y="345" fill="#C1121F" text-anchor="middle">INFRAESTRUCTURA</text>
    </g>
    <g>
      <rect x="768" y="322" width="228" height="36" rx="18" fill="#FFFFFF" stroke="#0B7FA0" stroke-opacity=".55"/>
      <text x="882" y="345" fill="#0B7FA0" text-anchor="middle">USUARIOS Y APLICACIONES</text>
    </g>
    <g>
      <rect x="1008" y="322" width="144" height="36" rx="18" fill="#FFFFFF" stroke="#0E8F66" stroke-opacity=".55"/>
      <text x="1080" y="345" fill="#0E8F66" text-anchor="middle">OPERACIÓN</text>
    </g>
  </g>

  <!-- Barra de acento inferior -->
  <rect x="18" y="396" width="1164" height="6" rx="3" fill="url(#bar)" opacity=".9"/>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#0F172A" stroke-opacity=".08" stroke-width="2"/>
</svg>
